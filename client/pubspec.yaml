# ============================================================
# 客户端依赖清单：记录这个 APP 用到了哪些第三方库
# 改过这个文件后，在 client 目录执行 flutter pub get 即可下载依赖
# ============================================================
name: running_club
description: "长跑社跑步数据收集APP（Flutter 客户端）"
publish_to: 'none' # 这是私有项目，不发布到公共仓库
version: 1.0.2+3

environment:
  sdk: ^3.5.0

# 依赖的第三方库
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0                # 发 HTTP 请求访问后端接口
  shared_preferences: ^2.3.0  # 把登录状态保存到手机本地
  url_launcher: ^6.2.0        # 打开附件链接（用系统浏览器打开 PDF/网页）
  image_picker: ^1.0.7        # 从相册/相机选图片（管理员发布文章用）

# 开发时用的工具库（不打进 APP）
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0       # 代码规范检查

# 依赖版本强制锁定（重要！不要删）
# shared_preferences_android 从 2.5.0 开始改用 JNI 直连 Kotlin 原生方法，
# 在本项目环境下运行时会崩溃：java.lang.NoSuchMethodError（登录后卡在登录页就是这个原因）。
# 这里强制锁定到 2.4.28 —— 最后一个用传统 MethodChannel 通信的稳定版本。
dependency_overrides:
  shared_preferences_android: 2.4.28

flutter:
  uses-material-design: true  # 使用 Material 自带图标
